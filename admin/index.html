<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>HAULO 가이드 관리자</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>

:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5E5E5E; --line:#E4E4E2; --soft:#F4F4F2; --tile2:#E9E9E7; --logo:none;
  --sans:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --head:60px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--head) + 16px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{filter:var(--logo)}
.ico{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* admin web */
.ad-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brandx{display:flex;align-items:center;gap:12px;flex:none}
.brandx img{height:22px;width:auto}
.brandx b{font-size:15px}
.ad-status{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:0 12px;height:30px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:500;white-space:nowrap}
.pill.warn{background:#FFF4E5;color:#8A4B00}
.stamp{color:var(--muted);white-space:nowrap}
.dot,.nav-art .dot,.nav-item .dot,.row>.dot{display:inline-block!important;width:8px!important;height:8px;border-radius:50%;background:#E8890C;flex:none!important;padding:0}
.ad-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn-ghost,.btn-primary{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost[aria-pressed="true"]{background:var(--soft);border-color:var(--ink)}
.btn-primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.btn-primary:disabled,.btn-ghost:disabled{opacity:.35;cursor:default}
.ad{display:grid;grid-template-columns:272px minmax(0,1fr);height:calc(100vh - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
@supports (height:100dvh){.ad{height:calc(100dvh - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
.ad-nav{background:var(--soft);border-right:1px solid var(--line);overflow-y:auto;padding:0 12px 24px;display:flex;flex-direction:column}
.nav-search{position:sticky;top:0;background:var(--soft);padding:14px 0 10px;z-index:1}
.nav-search input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 14px;font-size:14px;color:var(--ink)}
.nav-group{padding:10px 0;border-top:1px solid var(--line)}
.nav-group:first-of-type{border-top:0}
.nav-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px 8px}
.nav-add{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--ink);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px 6px;border-radius:6px}
.nav-add:hover{background:var(--bg)}
.nav-add .chev{width:14px;height:14px}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border:0;border-radius:10px;background:none;text-align:left;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.nav-item .ico{width:18px;height:18px;flex:none;stroke-width:1.8}
.nav-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item small{font-size:12px;color:var(--muted)}
.nav-item:hover,.nav-art:hover{background:var(--bg)}
.nav-item.on,.nav-art.on{background:var(--ink);color:var(--bg)}
.nav-item.on small{color:var(--bg);opacity:.7}
.nav-arts{list-style:none;margin:0 0 6px;padding:0 0 0 18px}
.nav-art{width:100%;display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px 0 12px;border:0;border-left:1px solid var(--line);border-radius:0 8px 8px 0;background:none;text-align:left;font-size:13.5px;color:var(--muted);cursor:pointer}
.nav-art span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-none{font-size:13px;color:var(--muted);padding:6px 10px}
.nav-foot{margin-top:auto;padding-top:16px;display:none;gap:8px}
.nav-foot a,.nav-foot button{flex:1;display:inline-flex;align-items:center;justify-content:center;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px;text-decoration:none;cursor:pointer}
.ad-main{overflow-y:auto;background:var(--bg)}
.pane{max-width:760px;margin:0 auto;padding:28px 32px 96px}
.pane-head{margin-bottom:22px}
.back{display:none;align-items:center;gap:4px;border:0;background:none;font-size:14px;padding:0;height:40px;margin-bottom:4px;cursor:pointer;color:var(--muted)}
.crumbx{font-size:13px;color:var(--muted);margin-bottom:4px}
.linkish{border:0;background:none;padding:0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.pane-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pane-title h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.pane-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn-sm{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);white-space:nowrap}
.btn-sm:hover{border-color:var(--ink)}
.btn-sm:disabled{opacity:.3;cursor:default}
.btn-sm.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-sm.danger{color:#B42318}
.btn-sm.danger.armed{background:#B42318;color:#fff;border-color:#B42318}
.btn-sm[data-dir]{padding:0}
.f{display:grid;gap:7px;margin-bottom:18px}
.f>label,.flabel{font-size:13px;font-weight:600;color:var(--ink)}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.ad input,.ad textarea,.ad select{width:100%;border:1px solid #D6D6D3;border-radius:10px;background:var(--bg);padding:11px 14px;font-size:15px;line-height:1.6;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.ad input:focus,.ad textarea:focus,.ad select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
.ad textarea{resize:vertical}
.title-in{font-size:22px!important;font-weight:700;padding:12px 14px!important}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:-6px 0 18px;font-size:13px;color:var(--muted)}
.meta-row label{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.meta-row select{width:auto;min-width:180px;padding:8px 12px;font-size:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid #D6D6D3;border-bottom:0;border-radius:10px 10px 0 0;background:var(--soft)}
.tb button{height:34px;padding:0 12px;border:1px solid transparent;border-radius:7px;background:var(--bg);font-size:13px;cursor:pointer;color:var(--ink)}
.tb button:hover{border-color:var(--ink)}
.body-ta{border-radius:0 0 10px 10px!important;min-height:420px;font-size:15.5px!important;line-height:1.8!important;padding:16px 18px!important}
.fmt-help summary{font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0;list-style:revert}
.fmt-help p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.fmt-help code,.howto code{font-family:inherit;font-weight:700;background:var(--soft);padding:1px 6px;border-radius:4px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px;align-items:start}
.icons{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;color:var(--ink)}
.icons button .ico{width:22px;height:22px}
.icons button[aria-checked="true"]{border:2px solid var(--ink);background:var(--soft)}
.sub-h{margin:28px 0 12px;font-size:15px;font-weight:700}
.sub-h-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.sub-h-row .sub-h{margin:16px 0 12px}
.rows{display:grid;gap:8px}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;color:var(--ink)}
.row:hover{border-color:var(--ink)}
.row .ico{width:22px;height:22px;flex:none}
.row>span{flex:1;min-width:0;display:grid;gap:2px}
.row b{font-size:15px;font-weight:600}
.row small{font-size:12.5px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:8px}
.row2 .row{flex:1}
.row-tools{display:flex;gap:4px}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 18px 4px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h b{font-size:15px}
.lead-note{margin:-10px 0 18px;font-size:14px;color:var(--muted)}
.empty-note{padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:14px}
.warnbox{margin:-8px 0 18px;padding:12px 14px;border-radius:10px;background:#FDECEA;color:#8A1C12;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{background:var(--soft);border-radius:12px;padding:16px;display:grid;gap:2px}
.stats b{font-size:24px}
.stats span{font-size:12.5px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick button{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--ink)}
.quick .ico,.quick .chev{width:22px;height:22px;flex:none}
.quick span{display:grid;gap:2px}
.quick b{font-size:14.5px}
.quick small{font-size:12.5px;color:var(--muted)}
.howto{display:grid;gap:22px;font-size:14.5px;line-height:1.75}
.howto h3{margin:0 0 6px;font-size:15px}
.howto ol,.howto ul{margin:0;padding-left:20px}
.howto p{margin:0}
.ad-pv{display:none;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--soft)}
.pv-cap{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ad-pv iframe{flex:1;width:100%;border:0;background:#fff}
.ad.pv-on .ad-pv{display:flex}
@media (min-width:1280px){.ad.pv-on{grid-template-columns:272px minmax(0,1fr) minmax(400px,42%)}}
@media (max-width:1279px){.ad.pv-on .ad-pv{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 0 auto;width:min(480px,100%);z-index:8;box-shadow:-12px 0 32px rgba(0,0,0,.12)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;line-height:1.55;width:max-content;max-width:min(440px,calc(100% - 32px));text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{max-width:520px;margin:15vh auto;padding:0 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.lock h1{margin:0;font-size:22px}
.lock p{margin:0;color:var(--muted)}
.lock a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700}
@media (max-width:899px){
  .ad-top{gap:10px;padding:0 14px}
  .brandx b,.hide-s{display:none}
  .ad-status .stamp{display:none}
  .ad{grid-template-columns:minmax(0,1fr)}
  .ad .ad-main{display:none}
  .ad.m-edit .ad-nav{display:none}
  .ad.m-edit .ad-main{display:block}
  .ad-nav{border-right:0;padding:0 16px 24px}
  .nav-foot{display:flex}
  .back{display:inline-flex}
  .pane{padding:12px 20px 96px}
  .grid2,.quick{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .body-ta{min-height:320px}
  .ad.pv-on .ad-pv{width:100%}
}
@media (max-width:420px){.pill{padding:0 10px;font-size:12px}.btn-primary{padding:0 14px}}
.body figure.img{margin:18px 0}
.body figure.img img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.body figcaption{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
.tb .tb-img{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.tb .tb-img .ico{width:16px;height:16px}
.body-ta.drag{border-color:var(--ink)!important;box-shadow:0 0 0 3px rgba(0,0,0,.08);background:var(--soft)!important}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.imgs figure{margin:0;width:112px;display:grid;gap:4px}
.imgs img{width:112px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--soft)}
.imgs figcaption{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs button{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px;cursor:pointer;color:#B42318}
.imgs-h{margin:14px 0 0;font-size:13px;font-weight:600}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pill.busy{background:#EAF2FF;color:#1C4FA0}
.lock-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);font-size:15px;font-weight:700;cursor:pointer;margin:0 4px}
.lock-btn.ghost{background:none;color:var(--ink)}
.nav-who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);word-break:break-all}
.nav-who button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;height:32px;padding:0 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.nav-foot{margin-top:12px}
body{overflow:hidden}
#root{height:100vh;height:100dvh;display:flex;flex-direction:column}
</style>
</head>

<script>
(function () {

var DATA = null, draft = null, dirty = false, adminMode = true, authState = 'checking', pvReady = false;
var ICONS = {

};
var ICON_NAMES = [['user', '사람'], ['coin', '적립금'], ['bag', '쇼핑백'], ['camera', '카메라'], ['link', '링크'], ['refresh', '교환'], ['help', '물음표'], ['chat', '말풍선'], ['check', '체크'], ['trend', '상승'], ['page', '페이지'], ['gift', '선물'], ['star', '별']];
function icon(n) { return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || ICONS.page) + '</svg>'; }
var CHEV = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
var CHEV_D = '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function safeUrl(u) { u = String(u || '').trim(); return /^(https?:\/\/|#)/i.test(u) ? u : ''; }
function inline(s) {

  if (act === 'icon') { setPath(draft, t.dataset.path, t.dataset.val); renderMain(); return changed(); }
  if (act === 'quick-art') { var c0 = (draft.categories || [])[0]; if (!c0) return toast('먼저 카테고리를 추가해 주세요.'); sel = { kind: 'cat', id: c0.id }; mView = 'edit'; renderMain(); refreshNav(); layout(); return toast('카테고리를 고른 뒤 ‘아티클 추가’를 눌러 주세요.'); }
  if (act === 'add-cat') {
    var id = rid('c'); (draft.categories = draft.categories || []).push({ id: id, name: '새 카테고리', desc: '', icon: 'page', articles: [] });
    sel = { kind: 'cat', id: id }; mView = 'edit'; pvRoute = 'c-' + id; renderMain(); layout(); changed();
    var n1 = document.getElementById('f-categories-' + (draft.categories.length - 1) + '-name'); if (n1) { n1.focus(); n1.select(); } return;
  }
  if (act === 'add-art') {

    var na = { id: rid('a'), title: '', body: '', updated: today() }; (rc.c.articles = rc.c.articles || []).push(na);

    else { var parts = t.dataset.id.split('.'); list = draft[parts[0]]; i = +parts[1]; }
    var j = i + dir; if (j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]); renderMain(); return changed();
  }
  if (act === 'l-add') {

    if (key === 'updates') (draft.updates = draft.updates || []).unshift({ date: today(), title: '', text: '', icon: 'check' });
    else (draft.steps = draft.steps || []).push({ title: '', desc: '' });
    renderMain(); changed();
    var first = document.getElementById(key === 'updates' ? 'f-updates-0-title' : 'f-steps-' + (draft.steps.length - 1) + '-title'); if (first) first.focus(); return;
  }
  if (act === 'del') {
    var k = t.dataset.key;
    if (confirmKey !== k) { confirmKey = k; return renderMain(); }
    confirmKey = '';
    var kk = k.split(':');
    if (kk[0] === 'art') { var r2 = findArt(kk[1]); if (r2) { r2.c.articles.splice(r2.ai, 1); sel = { kind: 'cat', id: r2.c.id }; } toast('아티클을 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else if (kk[0] === 'cat') { var r3 = findCat(kk[1]); if (r3) draft.categories.splice(r3.ci, 1); sel = { kind: 'home' }; toast('카테고리를 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else { draft[kk[0]].splice(+kk[1], 1); toast('삭제했어요.'); }
    pvRoute = routeForSel(); renderMain(); return changed();
  }
}
root.addEventListener('input', function (e) { if (adminMode) onAdminInput(e); });
root.addEventListener('change', function (e) {
  if (!adminMode) return;
  if (e.target.id === 'img-in') { uploadImages(e.target.files); e.target.value = ''; return; }
  if (e.target.dataset && e.target.dataset.role === 'move') onAdminInput(e);
});
root.addEventListener('click', onAdminClick);

/* ---------- Netlify: 로그인(Identity) + 저장(Git Gateway → GitHub) ---------- */
var BRANCH = 'main';   // GitHub 기본 브랜치 이름이 다르면 바꿔 주세요.
function gh(path, opts) {
  opts = opts || {};
  var u = window.netlifyIdentity && netlifyIdentity.currentUser();
  if (!u) return Promise.reject({ status: 401 });
  return u.jwt().then(function (t) {
    return fetch('/.netlify/git/github' + path, { method: opts.method || 'GET', body: opts.body, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } });
  }).then(function (r) {
    if (!r.ok) return r.text().then(function (x) { throw { status: r.status, body: x }; });
    return r.status === 204 ? null : r.json();
  });
}
function b64utf8(s) { var bin = atob(String(s).replace(/\s/g, '')), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
function canon(v) { if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']'; if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + canon(v[k]); }).join(',') + '}'; return JSON.stringify(v === undefined ? null : v); }
var CONTENT_RE = /^content\/(home|steps|updates|categories)\.json$|^content\/articles\/[A-Za-z0-9_.-]+\.json$/;

function loadAll() {
  return gh('/git/refs/heads/' + BRANCH).then(function (ref) {
    var head = ref.object.sha;
    return Promise.all([gh('/git/trees/' + head + '?recursive=1'), gh('/git/commits/' + head)]).then(function (res) {
      var want = res[0].tree.filter(function (e) { return e.type === 'blob' && CONTENT_RE.test(e.path); });
      return Promise.all(want.map(function (e) {
        return gh('/git/blobs/' + e.sha).then(function (bl) { return { path: e.path, sha: e.sha, obj: JSON.parse(b64utf8(bl.content)) }; });
      })).then(function (files) {
        var o = {}; files.forEach(function (f) { o[f.path] = f; });
        return { head: head, date: res[1].committer && res[1].committer.date, files: o };
      });
    });
  });
}
var orphanPaths = {};
function assemble(files) {
  function g(p) { return (files[p] && files[p].obj) || {}; }
  var home = g('content/home.json');
  var cats = (g('content/categories.json').categories || []).map(function (c) { return { id: c.id, name: c.name || '', desc: c.desc || '', icon: c.icon || 'page', articles: [] }; });
  var by = {}; cats.forEach(function (c) { by[c.id] = c; });
  var orphans = []; orphanPaths = {};
  Object.keys(files).filter(function (p) { return p.indexOf('content/articles/') === 0; }).forEach(function (p) {
    var a = files[p].obj || {}, id = p.slice('content/articles/'.length, -5);
    var item = { id: id, title: a.title || '', body: a.body || '', updated: a.updated || '', _o: Number(a.order) || 0 };
    if (by[a.category]) by[a.category].articles.push(item); else { orphans.push(item.title || id); orphanPaths[p] = true; }
  });
  cats.forEach(function (c) { c.articles.sort(function (x, y) { return x._o - y._o || x.title.localeCompare(y.title, 'ko'); }); c.articles.forEach(function (a) { delete a._o; }); });
  var hero = home.hero || {};
  return { hero: { title: hero.title || '', text: hero.text || '' }, chips: home.chips || [], links: home.links || {}, voice: home.voice || [],
    steps: g('content/steps.json').steps || [], updates: g('content/updates.json').updates || [], categories: cats, _orphans: orphans };
}
function serialize(d) {
  var o = {};
  o['content/home.json'] = { hero: { title: (d.hero || {}).title || '', text: (d.hero || {}).text || '' }, chips: d.chips || [], links: d.links || {}, voice: d.voice || [] };
  o['content/steps.json'] = { steps: d.steps || [] };
  o['content/updates.json'] = { updates: d.updates || [] };
  o['content/categories.json'] = { categories: (d.categories || []).map(function (c) { return { id: c.id, name: c.name, desc: c.desc, icon: c.icon }; }) };
  (d.categories || []).forEach(function (c) { (c.articles || []).forEach(function (a, j) {
    o['content/articles/' + a.id + '.json'] = { title: a.title, category: c.id, order: (j + 1) * 10, updated: a.updated || '', body: a.body };
  }); });
  return o;
}
var orig = {}, baseCommit = '';
function applyLoad(r) { orig = r.files; baseCommit = r.head; DATA = assemble(r.files); DATA.publishedAt = r.date || ''; }

/* 게시하지 않은 수정은 브라우저에 보관했다가, 그 사이 다른 관리자가 게시했으면 파일 단위로 합쳐서 되살려요. */
function keepLocal() {
  try {
    if (dirty && draft) { syncChips(); localStorage.setItem(LOCAL_KEY, JSON.stringify({ base: baseCommit, at: new Date().toISOString(), files: serialize(draft), baseFiles: serialize(DATA), pending: pendingShas() })); }
    else localStorage.removeItem(LOCAL_KEY);
  } catch (e) {}
}
function restoreLocal() {
  var L = null; try { L = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
  if (!L || !L.files) return '';
  var merged = {}, paths = {};
  [L.files, L.baseFiles || {}, orig].forEach(function (m) { Object.keys(m).forEach(function (p) { paths[p] = 1; }); });
  Object.keys(paths).forEach(function (p) {
    var ours = L.files[p], base = (L.baseFiles || {})[p], theirs = orig[p] && orig[p].obj;
    var mine = canon(ours) !== canon(base);
    var v = mine ? ours : theirs;
    if (v !== undefined && v !== null) merged[p] = { obj: v };
  });
  Object.keys(L.pending || {}).forEach(function (p) { if (!pending[p]) pending[p] = { sha: L.pending[p], url: null }; });
  var keep = orphanPaths;
  draft = assemble(merged); orphanPaths = keep; delete draft._orphans;
  draft.chipsText = (draft.chips || []).join(', ');
  dirty = countChanges() > 0;
  if (!dirty) { try { localStorage.removeItem(LOCAL_KEY); } catch (e) {} return ''; }
  return (L.base === baseCommit ? '게시하지 않은 수정 내용(' + fmtTime(L.at) + ' 보관)을 불러왔어요.' : '게시하지 않은 수정 내용(' + fmtTime(L.at) + ' 보관)을 최신 내용과 합쳐서 불러왔어요. 확인 후 게시해 주세요.');
}

function doPublish(btn) {
  syncChips();
  var next = serialize(draft), writes = [], dels = [];
  Object.keys(next).forEach(function (p) { if (!orig[p] || canon(orig[p].obj) !== canon(next[p])) writes.push(p); });
  Object.keys(orig).forEach(function (p) { if (p.indexOf('content/articles/') === 0 && !next[p] && !orphanPaths[p]) dels.push(p); });
  var bodies = (draft.categories || []).map(function (c) { return (c.articles || []).map(function (a) { return a.body; }).join('\n'); }).join('\n');
  var imgs = Object.keys(pending).filter(function (p) { return bodies.indexOf('(' + p + ')') > -1; });
  if (!writes.length && !dels.length && !imgs.length) return toast('게시할 변경 사항이 없어요.');
  btn.disabled = true; toast('게시하는 중이에요…');
  var head;
  gh('/git/refs/heads/' + BRANCH).then(function (ref) {
    head = ref.object.sha;
    if (head === baseCommit) return;
    return gh('/git/trees/' + head + '?recursive=1').then(function (tr) {
      var m = {}; tr.tree.forEach(function (e) { m[e.path] = e.sha; });
      var clash = writes.concat(dels).filter(function (p) { return (m[p] || null) !== (orig[p] ? orig[p].sha : null); });
      if (clash.length) throw { clash: clash };
    });
  }).then(function () { return gh('/git/commits/' + head); })
  .then(function (cm) {
    var tree = writes.map(function (p) { return { path: p, mode: '100644', type: 'blob', content: JSON.stringify(next[p], null, 2) + '\n' }; })
      .concat(dels.map(function (p) { return { path: p, mode: '100644', type: 'blob', sha: null }; }))
      .concat(imgs.map(function (p) { return { path: p.slice(1), mode: '100644', type: 'blob', sha: pending[p].sha }; }));
    return gh('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: cm.tree.sha, tree: tree }) });
  }).then(function (tr) {
    return gh('/git/commits', { method: 'POST', body: JSON.stringify({ message: '가이드 수정 (' + (userEmail || '관리자') + ')', tree: tr.sha, parents: [head] }) });
  }).then(function (c) {
    return gh('/git/refs/heads/' + BRANCH, { method: 'PATCH', body: JSON.stringify({ sha: c.sha }) }).then(function () { return c.sha; });
  }).then(function (sha) {
    imgs.forEach(function (p) { delete pending[p]; });
    dirty = false; try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
    watchDeploy(sha);
    return loadAll().then(function (r) { applyLoad(r); fresh(); drawEditor('게시했어요. 1분 안팎으로 크리에이터 화면에 반영돼요.'); preview(); });
  }).catch(function (err) {
    btn.disabled = false;
    if (err && err.clash) { keepLocal(); return toast('다른 관리자가 같은 항목을 먼저 게시했어요. 수정 내용은 보관했으니 새로고침한 뒤 확인하고 다시 게시해 주세요.'); }
    toast('게시하지 못했어요. 잠시 후 다시 시도해 주세요. (' + ((err && err.status) || '네트워크 오류') + ')');
  });
}
var deploying = false;
function watchDeploy(sha) {
  deploying = true; refreshTop();
  var tries = 0;
  (function poll() {
    fetch('/guide.json?ts=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (g) {
      if (g.commit === sha) { deploying = false; refreshTop(); return toast('크리에이터 화면에 반영됐어요.'); }
      if (++tries > 30) { deploying = false; refreshTop(); return toast('반영이 늦어지고 있어요. Netlify의 Deploys 화면에서 배포 상태를 확인해 주세요.'); }
      setTimeout(poll, 8000);
    });
  })();
}

/* ---------- 시작 ---------- */
var userEmail = '';
window.addEventListener('message', function (e) {
  if (e.origin === location.origin && e.data && e.data.type === 'haulo-preview-ready') { pvReady = true; lastPv = '__'; preview(); }
});
function boot() {
  var u = window.netlifyIdentity && netlifyIdentity.currentUser();
  if (!u) { authState = 'login'; return renderAdmin(); }
  userEmail = u.email || '';
  authState = 'loading'; renderAdmin();
  loadAll().then(function (r) {
    applyLoad(r); authState = 'ok'; draft = null; fresh();
    var msg = restoreLocal();
    if (DATA._orphans.length) msg = (msg ? msg + ' ' : '') + '카테고리가 없어 화면에 안 보이는 아티클이 있어요: ' + DATA._orphans.join(', ');
    renderAdmin(msg);
  }).catch(function (err) {
    authState = 'error';
    var s = err && err.status;
    renderAdmin(s === 401 || s === 403 ? '로그인이 만료됐거나 권한이 없어요. 로그아웃 후 다시 로그인해 주세요.'
      : s ? 'Git Gateway 연결을 확인해 주세요. Netlify의 Identity → Services에서 Git Gateway가 켜져 있어야 해요. (' + s + ')'
      : '네트워크 연결을 확인해 주세요.');
  });
}
if (window.netlifyIdentity) {
  netlifyIdentity.on('init', function () { if (authState === 'checking') boot(); });
  netlifyIdentity.on('login', function () { netlifyIdentity.close(); boot(); });
  netlifyIdentity.on('logout', function () { authState = 'login'; draft = null; dirty = false; renderAdmin(); });
  setTimeout(function () { if (authState === 'checking') boot(); }, 1500);
} else { authState = 'error'; renderAdmin('로그인 도구를 불러오지 못했어요. 새로고침해 주세요.'); }

renderAdmin();
})();
