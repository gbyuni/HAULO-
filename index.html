<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAULO 크리에이터 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style id="css">
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5E5E5E; --line:#E4E4E2; --soft:#F4F4F2; --tile2:#E9E9E7; --logo:none;
  --sans:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --head:60px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--head) + 16px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{filter:var(--logo)}
.ico{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--head)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px}
.brand img{height:24px;width:auto}
.brand span{font-size:13px;color:var(--muted);padding-top:3px}
.top nav{display:flex;align-items:center;gap:4px}
.top nav a{font-size:14px;text-decoration:none;padding:0 10px;min-height:44px;display:inline-flex;align-items:center}
.top nav a.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 16px;min-height:38px;font-weight:700}
@media (max-width:440px){.brand span,.top nav a.mall{display:none}}

/* hero: banner image that continues, dimmed, behind the search area */
.hero{position:relative;overflow:hidden;background:#000;color:#fff;--bh:min(52.3vw,560px)}
.hero .ban{position:absolute;top:0;left:0;width:100%;height:var(--bh);object-fit:cover;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero .wrap{position:relative;padding-top:calc(var(--bh) + 8px);padding-bottom:72px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;width:100%;max-width:1120px;box-sizing:border-box}
.hero .wrap>*{max-width:100%;min-width:0;box-sizing:border-box}
.hero .wrap>.search{max-width:min(560px,100%)}
.hero .wrap>p.lead{max-width:min(30em,100%)}
.hero h1,.hero p.lead{overflow-wrap:anywhere}
@media (min-width:900px){.hero .wrap{padding-top:calc(var(--bh) + 16px);padding-bottom:96px;gap:24px}}
.eyebrow{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;color:#D9D9D9}
.hero h1{margin:0;font-size:clamp(22px,4.2vw,34px);line-height:1.3;font-weight:700;letter-spacing:-.02em;color:#fff}
.hero p.lead{margin:-8px 0 0;color:#BDBDBD;max-width:30em;font-size:15px}
.search{position:relative;width:100%;max-width:min(560px,100%);margin-top:8px}
.search .box{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:999px;padding:0 6px 0 20px;min-height:56px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:#000;font-size:16px;outline:none;padding:14px 0}
.search input::placeholder{color:#6A6A6A}
.search .go{border:0;border-radius:999px;background:#000;color:#fff;font-weight:700;font-size:14px;padding:0 20px;min-height:44px;cursor:pointer}
.search .box:focus-within{outline:2px solid #fff;outline-offset:3px}
.results{list-style:none;margin:8px 0 0;padding:6px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-height:360px;overflow:auto}
.results a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none}
.results a:hover,.results a:focus-visible{background:var(--soft)}
.results small{display:block;font-size:12px;color:var(--muted)}
.results .none{padding:12px 14px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 18px;margin-top:-6px}
.chips button{background:none;border:0;color:#BDBDBD;font-size:14px;padding:0 2px;min-height:40px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:5px}
.chips button:hover{color:#fff;text-decoration-color:#fff}
.hero :focus-visible{outline-color:#fff}

#root{min-height:100vh;display:flex;flex-direction:column}
#root>main{flex:1 0 auto}
/* section heads, like the mall: English title + Korean line */
.sec{padding:56px 0 0}
.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:20px}
.head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em}
.head p{margin:0;font-size:14px;color:var(--muted)}
@media (min-width:900px){.sec{padding-top:72px}.head h2{font-size:26px}}

/* update cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ucard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ucard .tile{height:140px;display:flex;align-items:center;justify-content:center}
.ucard .tile .ico{width:48px;height:48px;stroke-width:1.3}
.t0{background:#000;color:#fff}
.t1{background:var(--tile2);color:var(--ink)}
.t2{background:#3A3A3A;color:#fff}
.ucard .in{padding:18px 20px 20px;display:grid;gap:4px}
.ucard time{font-size:12px;color:var(--muted)}
.ucard h3{margin:0;font-size:17px;font-weight:700}
.ucard p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps li{background:var(--soft);border-radius:16px;padding:20px;display:grid;gap:6px;align-content:start}
.steps .n{font-size:11px;font-weight:700;letter-spacing:.14em}
.steps strong{font-size:16px}
.steps span.d{font-size:14px;color:var(--muted);line-height:1.6}
@media (max-width:420px){.steps{grid-template-columns:1fr 1fr}}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:10px;padding:22px;border:1px solid var(--line);border-radius:16px;text-decoration:none;background:var(--bg);min-height:190px}
.ccard:hover{border-color:var(--ink)}
.ccard strong{font-size:17px}
.ccard p{margin:0;font-size:14px;color:var(--muted);line-height:1.6;flex-grow:1}
.ccard small{font-size:13px;color:var(--muted)}
.ccard.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ccard.dark p,.ccard.dark small{color:var(--bg);opacity:.75}
@media (max-width:520px){.cats{grid-template-columns:1fr 1fr;gap:10px}.ccard{padding:16px;min-height:170px}.ccard p{font-size:13px}}

/* voice */
.voice{margin-top:72px;background:var(--soft);border-top:1px solid var(--line)}
.voice .wrap{padding-top:48px;padding-bottom:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:10px;align-content:start}
.vcard h2{margin:0;font-size:18px;font-weight:700}
.vcard p{margin:0;font-size:14.5px;color:var(--muted)}
.obtn{justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:700;font-size:14px}
.obtn.off{opacity:.4;pointer-events:none}

/* footer */
footer{background:#000;color:#A8A8A8;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:32px;padding-bottom:32px}
footer img{height:22px;width:auto;filter:invert(1)}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
footer a{text-decoration:none;color:#D0D0D0}

/* article / category layout */
.doc .wrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px 48px;padding-top:28px;padding-bottom:72px}
.side{flex:1 1 220px;max-width:260px}
.side-toggle{display:none}
.side ul{list-style:none;margin:0;padding:0}
.side .label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.12em;padding:0 10px 8px}
.side a{display:block;text-decoration:none;padding:9px 10px;border-radius:10px;font-size:15px}
.side a:hover{background:var(--soft)}
.side li.on>a{font-weight:700}
.side .sub{background:var(--soft);border-radius:12px;padding:4px;margin:2px 0 6px}
.side .sub a{font-size:14px;color:var(--muted);padding:8px 10px 8px 16px}
.side .sub a[aria-current="page"]{background:var(--bg);color:var(--ink);font-weight:700}
.main{flex:999 1 560px;min-width:0}
@media (max-width:860px){
  .side{max-width:none;flex-basis:100%}
  .side-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--soft);border:0;border-radius:12px;padding:0 16px;min-height:48px;font-weight:700;cursor:pointer}
  .side-toggle .chev{transition:transform .2s}
  .side-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .side .label{display:none}
  .side nav{padding-top:8px}
  .side nav[data-closed]{display:none}
}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.main h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);line-height:1.35;font-weight:700;letter-spacing:-.02em}
.meta{font-size:13px;color:var(--muted);margin-bottom:24px}
.lead2{margin:0 0 20px;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.alist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.alist a:hover{background:var(--soft)}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{font-size:16px;max-width:44em}
.body p{margin:0 0 14px}
.body ul,.body ol{margin:0 0 14px;padding-left:22px}
.body li{margin-bottom:6px}
.body .note{background:var(--soft);border-radius:12px;padding:16px 18px;margin:14px 0;font-size:15px}
.body a{text-underline-offset:3px}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;min-width:380px;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:12px 16px;border-top:1px solid var(--line);vertical-align:top}
.tbl th,.tbl td:first-child{white-space:nowrap}
@media (max-width:600px){.tbl table{font-size:14px;min-width:0}.tbl th,.tbl td{padding:10px 12px}}
.tbl thead th{border-top:0;background:var(--soft);font-weight:700}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:40px 0 24px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fb strong{font-size:13px;font-weight:500}
.fb .b{display:flex;gap:6px}
.fb button{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--muted);cursor:pointer}
.fb button:hover{color:var(--ink);border-color:var(--ink)}
.fb button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fb a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pn a{display:grid;gap:2px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none}
.pn a:hover{border-color:var(--ink)}
.pn small{font-size:12px;color:var(--muted)}
.pn .nx{text-align:right}
.rel{margin-top:28px}
.rel h2{font-size:16px;margin:0 0 8px}
.rel a{display:block;padding:6px 0;font-size:15px}

.offtag{font-style:normal;font-size:11px;font-weight:600;color:var(--muted);background:var(--line);border-radius:999px;padding:1px 7px;margin-left:6px;flex:none}
.nav-item.on .offtag{background:rgba(255,255,255,.2);color:var(--bg)}
.nav-h>span{display:inline-flex;align-items:center}
.nav-sub{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);padding:12px 10px 4px}
.bmono.xs{width:18px;height:18px;border-radius:5px;flex:none}
.bmono.xs span{font-size:11px}
.bmono.sm{width:40px;height:40px;border-radius:10px;flex:none}
.bmono.sm span{font-size:17px}
.bmono.md{width:72px;height:72px;flex:none}
.bmono.md span{font-size:28px}
.nav-item.on .bmono.xs{background:rgba(255,255,255,.2);color:var(--bg)}
.logo-f{display:flex;align-items:center;gap:16px}
.logo-btns{display:grid;gap:6px}
.intro-ta{min-height:180px}
.muted{color:var(--muted);font-weight:500;font-size:13px}
.sw{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.sw-t{width:34px;height:20px;border-radius:999px;background:#C9C9C6;position:relative;transition:background .15s}
.sw-k{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"] .sw-t{background:var(--ink)}
.sw[aria-checked="true"] .sw-k{transform:translateX(14px)}
.sw[aria-checked="false"] .sw-l{color:var(--muted)}
.secrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.secrow .sec-info{flex:1;min-width:0;display:grid;gap:2px}
.secrow b{font-size:15px}
.secrow small{font-size:12px;color:var(--muted);letter-spacing:.06em}
.secrow.is-off{background:var(--soft)}
.secrow.is-off b{color:var(--muted)}
@media (prefers-reduced-motion: reduce){.sw-t,.sw-k{transition:none}}
/* mobile overrides (kept last) */
@media (max-width:600px){
  .ucard{flex-direction:row;align-items:stretch}
  .ucard .tile{width:84px;height:auto;flex:none}
  .ucard .tile .ico{width:30px;height:30px}
  .ucard .in{padding:14px 16px}
  .search .box{padding-left:16px}
  .search .go{padding:0 16px}
}
@media (max-width:420px){.steps li:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:600px){.wrap{padding:0 26px}.adm-top .bar{padding:0 20px}.voice .wrap{padding-top:40px;padding-bottom:40px}}

/* landing intro: logo, then title, then the rest ripple in (about 0.8s, once) */
@media (prefers-reduced-motion: no-preference){
  @keyframes in-logo{from{opacity:0;transform:scale(1.05);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  @keyframes in-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes in-fade{from{opacity:0}to{opacity:1}}
  .intro .hero .ban{animation:in-logo .9s cubic-bezier(.25,.46,.45,.94) both}
  .intro .hero .eyebrow{animation:in-rise .8s .3s cubic-bezier(.25,.46,.45,.94) both}
  .intro .hero h1{animation:in-rise .8s .4s cubic-bezier(.25,.46,.45,.94) both}
  .intro .ripple{animation:in-rise .85s cubic-bezier(.25,.46,.45,.94) both;animation-delay:calc(.62s + var(--i,0) * .1s)}
  .intro .top{animation:in-fade .7s .7s both}
}
.body h3{margin:26px 0 10px;font-size:18px;font-weight:700}
.body figure.img{margin:18px 0}
.body figure.img img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.body figcaption{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-size:14px}
/* hero groups */
.hcopy{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.hcopy .lead{margin:4px 0 0!important}
.hfind{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.hfind .chips{margin-top:0}
.hcue{display:none}
/* mobile: the hero fills the first screen, logo larger, search anchored low */
@media (max-width:899px){
  .hero{--bh:min(40vh,70vw);--bh:min(40svh,70vw);display:flex;flex-direction:column;min-height:calc(100vh - var(--head) - env(safe-area-inset-top,0px));min-height:calc(100svh - var(--head) - env(safe-area-inset-top,0px))}
  .hero .wrap{flex:1;justify-content:flex-start;gap:0;padding-top:calc(var(--bh) - 14px);padding-bottom:64px}
  /* 카피와 검색창을 한 묶음으로, 로고 아래 남는 공간의 세로 가운데에 */
  .hcopy{margin-top:auto}
  .hero .wrap::after{content:"";margin-top:auto}
  .hero .ban{-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
  .hcopy{gap:10px}
  .eyebrow{font-size:15px}
  .hero h1{font-size:clamp(24px,6.8vw,29px);line-height:1.3;text-wrap:balance}
  .hero p.lead{font-size:14.5px;line-height:1.65}
  .hfind{margin-top:32px;gap:10px}
  .hcue{display:flex;align-items:center;justify-content:center;position:absolute;left:0;right:0;bottom:12px;width:44px;height:40px;margin:0 auto;color:#8C8C8C}
  .hcue svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
}
@media (max-width:899px) and (prefers-reduced-motion: no-preference){
  @keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  .hcue svg{animation:cue 2.4s ease-in-out 2.2s infinite}
}
@media (max-width:899px) and (max-height:679px){.hcue{display:none}.hero .wrap{padding-bottom:28px}.hfind{margin-top:24px}}
@media (max-width:899px) and (max-height:560px){.hero{min-height:0}}
/* 관리자 화면에서 엔터로 줄을 바꾼 곳은 그대로 줄바꿈해서 보여줘요. */
.hero p.lead,.ucard p,.vcard p,.steps span.d,.ccard p,.cat-head p,.lead2{white-space:pre-line}

/* readable article body */
.body{font-size:16.5px;line-height:1.85;max-width:42em;--hl:#ECEAE3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .body{--hl:#2D2D2B}}
:root[data-theme="dark"] .body{--hl:#2D2D2B}
.body p{margin:0 0 16px}
.body strong{font-weight:700;box-shadow:inset 0 -.42em 0 var(--hl)}
.body a{font-weight:600;text-underline-offset:4px;text-decoration-thickness:1.5px}

.sub-h-row .sub-h{margin:16px 0 12px}
.rows{display:grid;gap:8px}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;color:var(--ink)}
.row:hover{border-color:var(--ink)}
.row .ico{width:22px;height:22px;flex:none}
.row>span{flex:1;min-width:0;display:grid;gap:2px}
.row b{font-size:15px;font-weight:600}
.row small{font-size:12.5px;color:var(--muted)}
.row2{display:flex;align-items:center;gap:8px}
.row2 .row{flex:1}
.row-tools{display:flex;gap:4px}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 18px 4px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h b{font-size:15px}
.lead-note{margin:-10px 0 18px;font-size:14px;color:var(--muted)}
.empty-note{padding:24px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--muted);font-size:14px}
.warnbox{margin:-8px 0 18px;padding:12px 14px;border-radius:10px;background:#FDECEA;color:#8A1C12;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{background:var(--soft);border-radius:12px;padding:16px;display:grid;gap:2px}
.stats b{font-size:24px}
.stats span{font-size:12.5px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.quick button{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;cursor:pointer;color:var(--ink)}
.quick button:hover{border-color:var(--ink)}
.quick .ico,.quick .chev{width:22px;height:22px;flex:none}
.quick span{display:grid;gap:2px}
.quick b{font-size:14.5px}
.quick small{font-size:12.5px;color:var(--muted)}
.howto{display:grid;gap:22px;font-size:14.5px;line-height:1.75}
.howto h3{margin:0 0 6px;font-size:15px}
.howto ol,.howto ul{margin:0;padding-left:20px}
.howto p{margin:0}
.ad-pv{display:none;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--soft)}
.pv-cap{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 12px 0 16px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bg)}
.ad-pv iframe{flex:1;width:100%;border:0;background:#fff}
.ad.pv-on .ad-pv{display:flex}
@media (min-width:1280px){.ad.pv-on{grid-template-columns:272px minmax(0,1fr) minmax(400px,42%)}}
@media (max-width:1279px){.ad.pv-on .ad-pv{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 0 auto;width:min(480px,100%);z-index:8;box-shadow:-12px 0 32px rgba(0,0,0,.12)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:40;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;line-height:1.55;width:max-content;max-width:min(440px,calc(100% - 32px));text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{max-width:520px;margin:15vh auto;padding:0 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.lock h1{margin:0;font-size:22px}
.lock p{margin:0;color:var(--muted)}
.lock a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700}
@media (max-width:899px){
  .ad-top{gap:10px;padding:0 14px}
  .brandx b,.hide-s{display:none}
  .ad-status .stamp{display:none}
  .ad{grid-template-columns:minmax(0,1fr)}
  .ad .ad-main{display:none}
  .ad.m-edit .ad-nav{display:none}
  .ad.m-edit .ad-main{display:block}
  .ad-nav{border-right:0;padding:0 16px 24px}
  .nav-foot{display:flex}
  .back{display:inline-flex}
  .pane{padding:12px 20px 96px}
  .grid2,.quick{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .body-ta{min-height:320px}
  .ad.pv-on .ad-pv{width:100%}
}
@media (max-width:420px){.pill{padding:0 10px;font-size:12px}.btn-primary{padding:0 14px}}
.body figure.img{margin:18px 0}
.body figure.img img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.body figcaption{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
.tb .tb-img{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.tb .tb-img .ico{width:16px;height:16px}
.body-ta.drag{border-color:var(--ink)!important;box-shadow:0 0 0 3px rgba(0,0,0,.08);background:var(--soft)!important}
.imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.imgs figure{margin:0;width:112px;display:grid;gap:4px}
.imgs img{width:112px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--soft)}
.imgs figcaption{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgs button{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:12px;cursor:pointer;color:#B42318}
.imgs-h{margin:14px 0 0;font-size:13px;font-weight:600}
</style>

     "title": "적립금은 얼마나 받을 수 있나요?",
     "body": "하울로에 참여가 확정되면, 크리에이터님의 채널 규모에 맞춰 **쇼핑 적립금**을 드려요. 담당자가 확인한 뒤 하울로몰 회원 계정으로 바로 넣어 드려요.\n\n| 적립금 | 인스타그램 팔로워 | 유튜브 구독자 |\n| --- | --- | --- |\n| 20만 원 | 1만 미만 | 5천 미만 |\n| 30만 원 | 1만 이상 ~ 3만 미만 | 5천 이상 ~ 1만 미만 |\n| 40만 원 | 3만 이상 ~ 5만 미만 | 1만 이상 ~ 3만 미만 |\n| 50만 원 | 5만 이상 | 3만 이상 |\n\n- 인스타그램과 유튜브를 모두 운영하신다면, 둘 중 **더 높은 구간**으로 적용해 드려요.\n- 하울로가 처음 연락드린 계정, 즉 **콘텐츠를 올려 주실 채널**을 기준으로 해요.\n- 적립금은 최대 **50만 원**까지 드려요.\n\n> 참고: 적립금 1회 지급마다 콘텐츠 1개를 함께 만들어 주시면 돼요.",

     "body": "적립금보다 더 담고 싶은 제품이 있다면, 남은 금액은 결제로 함께 구매할 수 있어요.\n\n- 적립금을 넘는 **초과 구매**나 **추가 적립금**을 요청하실 때는 콘텐츠를 **2개** 만들어 주셔야 해요.\n- **BLACK 등급**이 되면 추가 적립금을 드려요. 금액은 승급할 때 안내드려요.\n\n> 참고: 소개하고 싶은 제품의 가격대가 높아 적립금 안에서 고르기 어렵다면, [카카오채널](http://pf.kakao.com/_mxlcdX/chat)로 담당자에게 먼저 문의해 주세요. 상황에 맞는 방법을 함께 찾아볼게요.",

     "id": "a06",
     "title": "제품은 이렇게 구매해요",
     "body": "적립금 안에서 마음에 드는 제품을 **자유롭게** 골라 보세요. 여러 브랜드의 제품을 함께 써 보면, 팔로워에게 들려줄 이야기도 더 풍성해져요.\n\n- 적립금은 **지급일로부터 30일 안에** 사용해 주세요.\n- 제품 가격은 브랜드 공식몰 정가 기준이에요.\n- 옵션과 사이즈를 꼭 확인해 주세요. 단순 변심이나 선택 오류로는 교환·반품이 어려워요.\n\n> 꼭 확인하세요: 제품이 출고되면 **출고일로부터 5일 안에** 어떤 제품으로 콘텐츠를 만들지 카카오채널로 알려주세요.\n\n> 팁: [입점 브랜드](#brands)에서 제품별 콘텐츠 가이드를 미리 보고 고르면, 콘텐츠 만들기가 훨씬 쉬워요.",

     "updated": "2026.10.27",
     "body": "Q. 어떤 경우에 교환·반품이 되나요?\n- 제품에 **이상이 있는 경우**에 교환·반품을 도와드려요. 불량, 배송 중 파손, 오배송, 상품 누락, 주문과 다른 옵션 발송이 해당돼요. 이때 반품 배송비는 **판매자가 부담**해요.\n- **단순 변심**이나 색상·사이즈 선택 오류로 인한 반품은 어려워요.\n\nQ. 어떻게 신청하나요?\n1. 제품 도착일로부터 **영업일 기준 7일 안에** [카카오채널](http://pf.kakao.com/_mxlcdX/chat)로 신청해 주세요.\n2. 제품 상태를 **사진**으로 함께 보내주세요.\n3. 브랜드 확인 후 순차적으로 교환 또는 환불을 진행해 드려요.\n\n> 참고: 환불할 때 사용한 적립금은 적립금으로 다시 드리고, 실제 결제한 금액은 결제 취소로 환불돼요."

     "id": "a12",
     "title": "판매 링크 게시하기",
     "body": "콘텐츠를 올린 뒤 **팔로워 전용 할인 링크**를 꼭 게시해 주세요. 스토리, 하이라이트, 프로필 링크 중 편한 곳에 두면 돼요.\n\n> 주의사항: 마이페이지의 판매 링크가 아닌, **담당자가 카카오톡으로 전달한 링크**를 게시해 주세요!\n\n> 팁: 판매가 잘 되는 게시 방법은 [판매 꿀팁](#a26)에서 확인해 보세요.",

    {
     "id": "a26",
     "title": "판매 꿀팁: 판매가 잘 되는 콘텐츠 만들기",
     "updated": "2026.10.27",
     "body": "하울로는 크리에이터님의 **진짜 반응과 진짜 추천**이 가장 강력한 구매 이유라고 믿어요. 평소 스타일대로 만들되, 아래 포인트를 더하면 판매로 이어지는 힘이 훨씬 커져요.\n\n### 1. 링크는 보이는 곳 세 군데에\n- **스토리, 하이라이트, 프로필 링크**에 모두 게시해 주세요.\n- 스토리는 24시간이 지나면 사라지니, **하이라이트**에 꼭 저장해 두세요.\n\n### 2. 댓글로 DM 자동 발송하기\n- “댓글 남겨 주시면 링크 보내드릴게요”처럼 **댓글 참여**를 유도하고, 자동 DM으로 링크를 보내 보세요.\n- 팔로우를 함께 요청하면 다음 콘텐츠의 도달도 높아져요.\n\n### 3. ‘기간 한정’을 분명하게\n- 판매는 정해진 기간에만 열려요. **“단 N일간만”** 받을 수 있는 혜택이라는 점을 분명하게 보여주세요.\n\n### 4. 최소 3번은 다시 알려요\n1. **콘텐츠 업로드 직후:** 혜택과 판매 기간을 알려요.\n2. **판매 종료 3일 전:** 아직 못 본 팔로워에게 다시 알려요.\n3. **판매 종료 전날:** “내일 마감”으로 마지막 한 번 더!\n\n### 5. 가격은 한눈에 보이게\n- **공식 가격 → 팔로워 전용 가격**처럼 화살표로 나란히 보여주면, 혜택이 바로 전달돼요.\n- ‘비밀 할인’, ‘팔로워 전용 혜택’처럼 **특별함**을 강조해 주세요.\n\n> 주의: **‘최저가’**라는 표현은 쓰지 말아 주세요. 대신 ‘비밀 할인’, ‘팔로워 전용 혜택’ 같은 표현을 써 주세요.\n\n### 6. 피드보다 릴스\n- 릴스가 피드보다 **도달률이 높은 편**이에요. 고민된다면 릴스를 추천해요.\n\n### 7. 크리에이터님의 스타일 그대로\n- 제품별 가이드는 [입점 브랜드](#brands)에서 확인할 수 있어요. 가이드는 참고만 하고, 크리에이터님이 직접 써 본 **솔직한 사용 경험**을 담아 주세요.\n\n> 팁: 팔로워는 광고 문구보다 크리에이터님의 진짜 추천에 더 크게 반응해요. 그게 가장 좋은 구매 전환으로 이어져요."

     "id": "a13",
     "title": "수수료율과 회원 등급",
     "body": "수수료율은 기본 10%에서 시작해 누적 매출 100만 원을 넘으면 20%로 올라가요.\n\n| 누적 매출 | 수수료율 | 등급 |\n| --- | --- | --- |\n| 100만 원 미만 | 10% | SILVER |\n| 100만 원 이상 | 20% | BLACK |\n\n> 20% 구간은 소급 적용돼요. 누적 매출이 120만 원이면 120만 원 전체에 20%가 적용되어 수수료는 24만 원이에요.\n\n| 등급 | 기준 | 혜택 |\n| --- | --- | --- |\n| WHITE | 회원가입 완료, 참여 확정 전 | 제품 둘러보기 및 구매 |\n| SILVER | 참여 확정 | 최초 가입 적립금, 적립금 사용 |\n| BLACK | 누적 매출 100만 원 이상 | 수수료 20%, 추가 할인, 추가 적립금 |",
     "updated": "2026.10.22"

     "id": "a14",
     "title": "수수료 정산",
     "body": "판매 리워드는 **한 달 단위**로 정산해요.\n\n1. 매월 1일부터 말일까지 판매 링크로 발생한 판매를 모아요.\n2. 반품·취소된 주문을 제외하고 리워드를 확정해요.\n3. **다음 달 말일**에 입금해 드려요. 예를 들어 10월 판매분은 11월 말일에 입금돼요.\n\n> 꼭 확인하세요: 정산을 받으려면 링크디 파트너스 **마이페이지**에 **신분증 사본**(주민등록번호 뒷자리 포함)과 **통장 사본**을 등록해 주셔야 해요.\n\nQ. 판매 현황은 어디서 보나요?\n링크디 파트너스 **마이페이지**에서 방문 수, 주문 건수, 리워드를 실시간으로 확인할 수 있어요.",

function catChanged(c, ci) {
  var o = null, oi = -1; (DATA.categories || []).forEach(function (x, i) { if (x.id === c.id) { o = x; oi = i; } });
  if (!o) return true;
  return o.name !== c.name || o.desc !== c.desc || o.icon !== c.icon || oi !== ci || (o.articles || []).length !== (c.articles || []).length;
}
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function findBrand(id) { var bs = draft.brands || []; for (var i = 0; i < bs.length; i++) if (bs[i].id === id) return { b: bs[i], bi: i }; return null; }
function findProd(id) { var bs = draft.brands || []; for (var i = 0; i < bs.length; i++) { var ps = bs[i].products || []; for (var j = 0; j < ps.length; j++) if (ps[j].id === id) return { p: ps[j], b: bs[i], bi: i, pj: j }; } return null; }
function brandChanged(b, i) {
  var os = DATA.brands || [], o = os.filter(function (x) { return x.id === b.id; })[0]; if (!o) return true;
  function strip(x) { var y = JSON.parse(JSON.stringify(x)); y.products = (y.products || []).map(function (q) { return q.id; }); return y; }
  return os.indexOf(o) !== i || !same(strip(o), strip(b));
}
function prodChanged(q, b, j) {
  var o = null; (DATA.brands || []).forEach(function (x) { (x.products || []).forEach(function (y, k) { if (y.id === q.id) o = { p: y, bid: x.id, j: k }; }); });
  return !o || o.bid !== b.id || o.j !== j || o.p.name !== q.name || o.p.body !== q.body || (o.p.link || '') !== (q.link || '');
}
function secChanged(k) {
  syncChips();
  if (k === 'basic') return !same([draft.hero, draft.chips, draft.links, draft.voice, draft.tipsBanner || null], [DATA.hero, DATA.chips, DATA.links, DATA.voice, DATA.tipsBanner || null]);
  if (k === 'sections') return !same(sections(draft), sections(DATA));
  if (k === 'apply') return !same(draft.apply || {}, DATA.apply || {});
  if (k === 'publicSite') return !same(draft.publicSite || null, DATA.publicSite || null);
  return !same(draft[k], DATA[k]);
}
function countChanges() {
  var n = 0;
  (draft.categories || []).forEach(function (c, ci) { if (catChanged(c, ci)) n++; (c.articles || []).forEach(function (a, ai) { if (artChanged(a, c, ai)) n++; }); });
  (DATA.categories || []).forEach(function (c) { if (!findCat(c.id)) n++; (c.articles || []).forEach(function (a) { if (!findArt(a.id)) n++; }); });
  ['updates', 'steps', 'basic', 'sections', 'brandCats', 'apply', 'publicSite'].forEach(function (k) { if (secChanged(k)) n++; });
  (draft.brands || []).forEach(function (b, i) { if (brandChanged(b, i)) n++; (b.products || []).forEach(function (q, j) { if (prodChanged(q, b, j)) n++; }); });
  (DATA.brands || []).forEach(function (b) { if (!findBrand(b.id)) n++; (b.products || []).forEach(function (q) { if (!findProd(q.id)) n++; }); });
  return n;
}

    draft.sections = sections(draft); var s = draft.sections.filter(function (x) { return x.key === t.dataset.key; })[0];
    s.on = !s.on; renderMain(); changed();
    var nm = SEC_DEF.filter(function (x) { return x[0] === s.key; })[0][1];
    return toast(s.on ? '‘' + nm + '’ 영역을 홈 화면에 보여줘요. 게시하면 반영돼요.' : '‘' + nm + '’ 영역을 홈 화면에서 숨겨요. 내용은 그대로 남아 있어요.');
  }
  if (act === 'export') return exportPublic(t);
  if (act === 'apply-toggle') { draft.apply = draft.apply || {}; draft.apply.on = draft.apply.on === false; renderMain(); changed(); return toast(draft.apply.on ? '재협업 신청 페이지를 사용해요. 게시하면 반영돼요.' : '재협업 신청 페이지를 숨겨요. 게시하면 반영돼요.'); }
  if (act === 'sec-move') {
    var all = sections(draft), mv = all.filter(function (x) { return x.key !== 'voice'; }), vo = all.filter(function (x) { return x.key === 'voice'; });
    var si = mv.map(function (x) { return x.key; }).indexOf(t.dataset.id), sj = si + (+t.dataset.dir);
    if (sj < 0 || sj >= mv.length) return;
    mv.splice(sj, 0, mv.splice(si, 1)[0]); draft.sections = mv.concat(vo); renderMain(); return changed();
  }
  if (act === 'add-brand') {
    var bid = rid('b'), bcat = t.dataset.cat || ((draft.brandCats || [])[0] || {}).id || '';
    (draft.brands = draft.brands || []).push({ id: bid, name: '새 브랜드', cat: bcat, tagline: '', intro: '', url: '', deck: '', logo: '', products: [] });
    sel = { kind: 'brand', id: bid }; mView = 'edit'; pvRoute = 'b-' + bid; renderMain(); layout(); changed();
    var bn = document.getElementById('f-brands-' + (draft.brands.length - 1) + '-name'); if (bn) { bn.focus(); bn.select(); } return;
  }
  if (act === 'add-prod') {
    var rb = findBrand(t.dataset.id); if (!rb) return;
    var np = { id: rid('p'), name: '', link: '', body: '', updated: today() }; (rb.b.products = rb.b.products || []).push(np);
    sel = { kind: 'prod', id: np.id }; pvRoute = 'p-' + np.id; renderMain(); changed();
    var pt2 = document.getElementById('f-title'); if (pt2) pt2.focus(); return;
  }
  if (act === 'bcat-add') { (draft.brandCats = draft.brandCats || []).push({ id: rid('k'), name: 'NEW', ko: '' }); renderMain(); return changed(); }
  if (act === 'logo-up') { if (!assetsApi) return toast('이 화면에서는 이미지를 올릴 수 없어요. 편집 권한이 있는 계정인지 확인해 주세요.'); return document.getElementById('logo-in').click(); }
  if (act === 'logo-rm') { var rl = findBrand(sel.id); if (rl) { rl.b.logo = ''; renderMain(); changed(); } return; }
  if (act === 'quick-art') { var c0 = (draft.categories || [])[0]; if (!c0) return toast('먼저 카테고리를 추가해 주세요.'); sel = { kind: 'cat', id: c0.id }; mView = 'edit'; renderMain(); refreshNav(); layout(); return toast('카테고리를 고른 뒤 ‘아티클 추가’를 눌러 주세요.'); }
  if (act === 'add-cat') {
    var id = rid('c'); (draft.categories = draft.categories || []).push({ id: id, name: '새 카테고리', desc: '', icon: 'page', articles: [] });
    sel = { kind: 'cat', id: id }; mView = 'edit'; pvRoute = 'c-' + id; renderMain(); layout(); changed();
    var n1 = document.getElementById('f-categories-' + (draft.categories.length - 1) + '-name'); if (n1) { n1.focus(); n1.select(); } return;
  }
  if (act === 'add-art') {
    var rc = findCat(t.dataset.id); if (!rc) return;
    var na = { id: rid('a'), title: '', body: '', updated: today() }; (rc.c.articles = rc.c.articles || []).push(na);
    sel = { kind: 'art', id: na.id }; pvRoute = na.id; renderMain(); changed();
    var ti = document.getElementById('f-title'); if (ti) ti.focus(); return;
  }
  if (act === 'art-move' || act === 'cat-move' || act === 'l-move' || act === 'brand-move' || act === 'prod-move') {
    var dir = +t.dataset.dir, list, i;
    if (act === 'brand-move') { list = draft.brands; i = findBrand(t.dataset.id).bi; }
    else if (act === 'prod-move') { var rq = findProd(t.dataset.id); list = rq.b.products; i = rq.pj; }
    else if (act === 'art-move') { var ra = findArt(t.dataset.id); list = ra.c.articles; i = ra.ai; }
    else if (act === 'cat-move') { list = draft.categories; i = findCat(t.dataset.id).ci; }
    else { var parts = t.dataset.id.split('.'); list = draft[parts[0]]; i = +parts[1]; }
    var j = i + dir; if (j < 0 || j >= list.length) return;
    list.splice(j, 0, list.splice(i, 1)[0]); renderMain(); return changed();
  }
  if (act === 'l-add') {
    var key = t.dataset.list;
    if (key === 'updates') (draft.updates = draft.updates || []).unshift({ date: today(), title: '', text: '', icon: 'check' });
    else (draft.steps = draft.steps || []).push({ title: '', desc: '' });
    renderMain(); changed();
    var first = document.getElementById(key === 'updates' ? 'f-updates-0-title' : 'f-steps-' + (draft.steps.length - 1) + '-title'); if (first) first.focus(); return;
  }
  if (act === 'del') {
    var k = t.dataset.key;
    if (confirmKey !== k) { confirmKey = k; return renderMain(); }
    confirmKey = '';
    var kk = k.split(':');
    if (kk[0] === 'art') { var r2 = findArt(kk[1]); if (r2) { r2.c.articles.splice(r2.ai, 1); sel = { kind: 'cat', id: r2.c.id }; } toast('아티클을 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else if (kk[0] === 'cat') { var r3 = findCat(kk[1]); if (r3) draft.categories.splice(r3.ci, 1); sel = { kind: 'home' }; toast('카테고리를 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else if (kk[0] === 'brand') { var r4 = findBrand(kk[1]); if (r4) draft.brands.splice(r4.bi, 1); sel = { kind: 'bhome' }; toast('브랜드를 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else if (kk[0] === 'prod') { var r5 = findProd(kk[1]); if (r5) { r5.b.products.splice(r5.pj, 1); sel = { kind: 'brand', id: r5.b.id }; } toast('제품 가이드를 삭제했어요. 게시 전이라면 변경 취소로 되돌릴 수 있어요.'); }
    else { draft[kk[0]].splice(+kk[1], 1); toast('삭제했어요.'); }
    pvRoute = routeForSel(); renderMain(); return changed();
  }
}
root.addEventListener('input', function (e) { if (adminMode) onAdminInput(e); });
root.addEventListener('change', function (e) {
  if (!adminMode) return;
  if (e.target.id === 'img-in') { uploadImages(e.target.files); e.target.value = ''; return; }
  if (e.target.id === 'logo-in') { uploadLogo(e.target.files && e.target.files[0]); e.target.value = ''; return; }
  if (e.target.dataset && (e.target.dataset.role === 'move' || e.target.dataset.role === 'pmove')) onAdminInput(e);
});
function uploadLogo(f) {
  var r = findBrand(sel.id); if (!f || !r) return;
  if (!assetsApi) return toast('이 화면에서는 이미지를 올릴 수 없어요. 편집 권한이 있는 계정인지 확인해 주세요.');
  toast('로고를 올리는 중이에요…');
  (f.type === 'image/svg+xml' ? Promise.resolve(f) : shrink(f)).then(function (bl) { return assetsApi.upload(bl); }).then(function (res) {
    var id = (res && res.id) || ''; if (!/^[0-9a-f]{32}$/.test(id)) { var mm = String(res && res.url || '').match(/[0-9a-f]{32}/); id = mm ? mm[0] : ''; }
    if (!id) throw {};
    r.b.logo = '/_blob/' + id; renderMain(); changed(); toast('로고를 넣었어요. 게시하면 크리에이터 화면에 보여요.');
  }).catch(function (err) { toast('로고를 올리지 못했어요. 다시 시도해 주세요. (' + ((err && err.code) || '오류') + ')'); });
}
root.addEventListener('click', onAdminClick);

/* the canonical page source, rebuilt from data (never from the live DOM) */
function buildPage(data) {
  var json = JSON.stringify(data, null, 1).replace(/</g, '\\u003c'), S = 'scr' + 'ipt';
  return '<!doctype html>\n<html lang="ko">\n<head>\n' + HEAD + '<style id="css">' + CSS + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    '<' + S + ' type="application/json" id="guide-data">' + json + '</' + S + '>\n<' + S + ' id="app">' + APP + '</' + S + '>\n</body>\n</html>\n';
}
var DRAFT_KEY = 'haulo-guide-draft';
function doPublish(btn) {
  if (!artifactApi) return drawEditor('이 화면에서는 게시할 수 없어요.');
  syncChips();
  var next = JSON.parse(JSON.stringify(draft)); delete next.chipsText; delete next._preview;
  next.rev = Math.random().toString(36).slice(2, 10);
  next.publishedAt = new Date().toISOString();
  try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ rev: next.rev, data: next })); } catch (e) {}
  btn.disabled = true; adminMsg('게시하는 중이에요…');
  var tries = 0;
  (function go() {
    artifactApi.publish(buildPage(next)).catch(function (err) {
      var code = err && err.code;
      if (code === 'upstream_error' && tries++ < 1) return setTimeout(go, 800 + Math.random() * 800);
      if (code === 'conflict') return;
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      if (code === 'not_writer' || code === 'not_granted') { authState = 'no'; renderAdmin(); return; }
      drawEditor(code === 'rate_limited' ? '잠시 후 다시 게시해 주세요.' : '게시하지 못했어요. 다시 시도해 주세요. (' + (code || '오류') + ')');
    });
  })();
}

/* ---------- start ---------- */
var saved = null;
try { saved = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
if (saved && !IS_PREVIEW && !DATA._public) { adminMode = true; if (location.hash !== '#admin') history.replaceState(null, '', '#admin'); }
render();
function checkAuth() {
  if (!adminMode || IS_PREVIEW || authState !== 'checking') return;
  if (!(window.claude && typeof window.claude.use === 'function')) { authState = 'no'; return renderAdmin(); }
  var timer = setTimeout(function () { if (authState === 'checking') { authState = 'no'; renderAdmin(); } }, 12000);
  Promise.all([window.claude.use('user'), window.claude.use('artifact'), window.claude.use('assets'), window.claude.use('downloads')]).then(function (r) {
    var user = r[0]; artifactApi = r[1]; assetsApi = r[2]; downloadsApi = r[3];
    if (!user || !artifactApi) return false;
    return user.canEdit();
  }).then(function (ok) {
    clearTimeout(timer);
    authState = ok ? 'ok' : 'no';
    var msg = '';
    if (ok && saved) {
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {}
      if (saved.rev === DATA.rev) { msg = '게시했어요. 크리에이터 화면에도 반영됐어요.'; try { localStorage.removeItem(LOCAL_KEY); } catch (e) {} }
      else { draft = saved.data; draft.chipsText = (draft.chips || []).join(', '); dirty = true; msg = '다른 관리자가 먼저 게시해서 저장되지 않았어요. 수정 내용을 다시 불러왔으니 확인 후 게시해 주세요.'; }
    } else if (ok) {
      var local = null;
      try { local = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null'); } catch (e) {}
      if (local && local.base === DATA.rev && local.draft) { draft = local.draft; dirty = true; msg = '게시하지 않은 수정 내용(' + fmtTime(local.at) + ' 보관)을 불러왔어요. 확인 후 게시하거나 변경 취소를 눌러 주세요.'; }
      else if (local) { try { localStorage.removeItem(LOCAL_KEY); } catch (e) {} if (local.draft) msg = '보관된 수정 내용이 있었지만, 그 사이 다른 관리자가 게시해서 정리했어요.'; }
    }
    renderAdmin(msg);
  }).catch(function () { clearTimeout(timer); authState = 'no'; renderAdmin(); });
}
checkAuth();
window.addEventListener('hashchange', checkAuth);
})();
