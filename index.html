<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HAULO 크리에이터 가이드</title>
<meta name="description" content="하울로 크리에이터를 위한 가입, 적립금, 콘텐츠 업로드, 판매 수익 가이드">
<link rel="icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --muted:#5E5E5E; --line:#E4E4E2; --soft:#F4F4F2; --tile2:#E9E9E7; --logo:none;
  --sans:"Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --head:60px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#000000;--ink:#F3F3F1;--muted:#A8A8A8;--line:#2A2A2A;--soft:#141414;--tile2:#1E1E1E;--logo:invert(1);color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:clip}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--head) + 16px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.logo{filter:var(--logo)}
.ico{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:var(--head)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-height:44px}
.brand img{height:24px;width:auto}
.brand span{font-size:13px;color:var(--muted);padding-top:3px}
.top nav{display:flex;align-items:center;gap:4px}
.top nav a{font-size:14px;text-decoration:none;padding:0 10px;min-height:44px;display:inline-flex;align-items:center}
.top nav a.pill{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 16px;min-height:38px;font-weight:700}
@media (max-width:440px){.brand span,.top nav a.mall{display:none}}

/* hero: banner image that continues, dimmed, behind the search area */
.hero{position:relative;overflow:hidden;background:#000;color:#fff;--bh:min(52.3vw,560px)}
.hero .ban{position:absolute;top:0;left:0;width:100%;height:var(--bh);object-fit:cover;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero .wrap{position:relative;padding-top:calc(var(--bh) + 8px);padding-bottom:72px;display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;width:100%;max-width:1120px;box-sizing:border-box}
.hero .wrap>*{max-width:100%;min-width:0;box-sizing:border-box}
.hero .wrap>.search{max-width:min(560px,100%)}
.hero .wrap>p.lead{max-width:min(30em,100%)}
.hero h1,.hero p.lead{overflow-wrap:anywhere}
@media (min-width:900px){.hero .wrap{padding-top:calc(var(--bh) + 16px);padding-bottom:96px;gap:24px}}
.eyebrow{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;color:#D9D9D9}
.hero h1{margin:0;font-size:clamp(22px,4.2vw,34px);line-height:1.3;font-weight:700;letter-spacing:-.02em;color:#fff}
.hero p.lead{margin:-8px 0 0;color:#BDBDBD;max-width:30em;font-size:15px}
.search{position:relative;width:100%;max-width:min(560px,100%);margin-top:8px}
.search .box{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:999px;padding:0 6px 0 20px;min-height:56px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:#000;font-size:16px;outline:none;padding:14px 0}
.search input::placeholder{color:#6A6A6A}
.search .go{border:0;border-radius:999px;background:#000;color:#fff;font-weight:700;font-size:14px;padding:0 20px;min-height:44px;cursor:pointer}
.search .box:focus-within{outline:2px solid #fff;outline-offset:3px}
.results{list-style:none;margin:8px 0 0;padding:6px;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-height:360px;overflow:auto}
.results a{display:block;padding:10px 14px;border-radius:10px;text-decoration:none}
.results a:hover,.results a:focus-visible{background:var(--soft)}
.results small{display:block;font-size:12px;color:var(--muted)}
.results .none{padding:12px 14px;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 18px;margin-top:-6px}
.chips button{background:none;border:0;color:#BDBDBD;font-size:14px;padding:0 2px;min-height:40px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3);text-underline-offset:5px}
.chips button:hover{color:#fff;text-decoration-color:#fff}
.hero :focus-visible{outline-color:#fff}

#root{min-height:100vh;display:flex;flex-direction:column}
#root>main{flex:1 0 auto}
/* section heads, like the mall: English title + Korean line */
.sec{padding:56px 0 0}
.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:20px}
.head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em}
.head p{margin:0;font-size:14px;color:var(--muted)}
@media (min-width:900px){.sec{padding-top:72px}.head h2{font-size:26px}}

/* update cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ucard{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.ucard .tile{height:140px;display:flex;align-items:center;justify-content:center}
.ucard .tile .ico{width:48px;height:48px;stroke-width:1.3}
.t0{background:#000;color:#fff}
.t1{background:var(--tile2);color:var(--ink)}
.t2{background:#3A3A3A;color:#fff}
.ucard .in{padding:18px 20px 20px;display:grid;gap:4px}
.ucard time{font-size:12px;color:var(--muted)}
.ucard h3{margin:0;font-size:17px;font-weight:700}
.ucard p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.steps li{background:var(--soft);border-radius:16px;padding:20px;display:grid;gap:6px;align-content:start}
.steps .n{font-size:11px;font-weight:700;letter-spacing:.14em}
.steps strong{font-size:16px}
.steps span.d{font-size:14px;color:var(--muted);line-height:1.6}
@media (max-width:420px){.steps{grid-template-columns:1fr 1fr}}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:10px;padding:22px;border:1px solid var(--line);border-radius:16px;text-decoration:none;background:var(--bg);min-height:190px}
.ccard:hover{border-color:var(--ink)}
.ccard strong{font-size:17px}
.ccard p{margin:0;font-size:14px;color:var(--muted);line-height:1.6;flex-grow:1}
.ccard small{font-size:13px;color:var(--muted)}
.ccard.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ccard.dark p,.ccard.dark small{color:var(--bg);opacity:.75}
@media (max-width:520px){.cats{grid-template-columns:1fr 1fr;gap:10px}.ccard{padding:16px;min-height:170px}.ccard p{font-size:13px}}

/* voice */
.voice{margin-top:72px;background:var(--soft);border-top:1px solid var(--line)}
.voice .wrap{padding-top:48px;padding-bottom:48px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:10px;align-content:start}
.vcard h2{margin:0;font-size:18px;font-weight:700}
.vcard p{margin:0;font-size:14.5px;color:var(--muted)}
.obtn{justify-self:start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1.5px solid var(--ink);border-radius:999px;text-decoration:none;font-weight:700;font-size:14px}
.obtn.off{opacity:.4;pointer-events:none}

/* footer */
footer{background:#000;color:#A8A8A8;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:32px;padding-bottom:32px}
footer img{height:22px;width:auto;filter:invert(1)}
footer nav{display:flex;flex-wrap:wrap;gap:18px}
footer a{text-decoration:none;color:#D0D0D0}

/* article / category layout */
.doc .wrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px 48px;padding-top:28px;padding-bottom:72px}
.side{flex:1 1 220px;max-width:260px}
.side-toggle{display:none}
.side ul{list-style:none;margin:0;padding:0}
.side .label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.12em;padding:0 10px 8px}
.side a{display:block;text-decoration:none;padding:9px 10px;border-radius:10px;font-size:15px}
.side a:hover{background:var(--soft)}
.side li.on>a{font-weight:700}
.side .sub{background:var(--soft);border-radius:12px;padding:4px;margin:2px 0 6px}
.side .sub a{font-size:14px;color:var(--muted);padding:8px 10px 8px 16px}
.side .sub a[aria-current="page"]{background:var(--bg);color:var(--ink);font-weight:700}
.main{flex:999 1 560px;min-width:0}
@media (max-width:860px){
  .side{max-width:none;flex-basis:100%}
  .side-toggle{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--soft);border:0;border-radius:12px;padding:0 16px;min-height:48px;font-weight:700;cursor:pointer}
  .side-toggle .chev{transition:transform .2s}
  .side-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .side .label{display:none}
  .side nav{padding-top:8px}
  .side nav[data-closed]{display:none}
}
.crumb{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--muted)}
.main h1{margin:0 0 6px;font-size:clamp(24px,4vw,32px);line-height:1.35;font-weight:700;letter-spacing:-.02em}
.meta{font-size:13px;color:var(--muted);margin-bottom:24px}
.lead2{margin:0 0 20px;color:var(--muted)}
.alist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.alist a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.alist a:hover{background:var(--soft)}
.chev{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{font-size:16px;max-width:44em}
.body p{margin:0 0 14px}
.body ul,.body ol{margin:0 0 14px;padding-left:22px}
.body li{margin-bottom:6px}
.body .note{background:var(--soft);border-radius:12px;padding:16px 18px;margin:14px 0;font-size:15px}
.body a{text-underline-offset:3px}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:12px}
.tbl table{width:100%;min-width:380px;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:12px 16px;border-top:1px solid var(--line);vertical-align:top}
.tbl th,.tbl td:first-child{white-space:nowrap}
@media (max-width:600px){.tbl table{font-size:14px}.tbl th,.tbl td{padding:10px 12px}}
.tbl thead th{border-top:0;background:var(--soft);font-weight:700}
.fb{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:40px 0 24px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.fb strong{font-size:13px;font-weight:500}
.fb .b{display:flex;gap:6px}
.fb button{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:var(--bg);color:var(--muted);cursor:pointer}
.fb button:hover{color:var(--ink);border-color:var(--ink)}
.fb button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fb a{color:var(--ink);font-weight:600;text-underline-offset:3px}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pn a{display:grid;gap:2px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;text-decoration:none}
.pn a:hover{border-color:var(--ink)}
.pn small{font-size:12px;color:var(--muted)}
.pn .nx{text-align:right}
.rel{margin-top:28px}
.rel h2{font-size:16px;margin:0 0 8px}
.rel a{display:block;padding:6px 0;font-size:15px}

/* mobile overrides (kept last) */
@media (max-width:600px){
  .ucard{flex-direction:row;align-items:stretch}
  .ucard .tile{width:84px;height:auto;flex:none}
  .ucard .tile .ico{width:30px;height:30px}
  .ucard .in{padding:14px 16px}
  .search .box{padding-left:16px}
  .search .go{padding:0 16px}
}
@media (max-width:420px){.steps li:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:600px){.wrap{padding:0 26px}.adm-top .bar{padding:0 20px}.voice .wrap{padding-top:40px;padding-bottom:40px}}

/* landing intro: logo, then title, then the rest ripple in (about 0.8s, once) */
@media (prefers-reduced-motion: no-preference){
  @keyframes in-logo{from{opacity:0;transform:scale(1.05);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
  @keyframes in-rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes in-fade{from{opacity:0}to{opacity:1}}
  .intro .hero .ban{animation:in-logo .9s cubic-bezier(.25,.46,.45,.94) both}
  .intro .hero .eyebrow{animation:in-rise .8s .3s cubic-bezier(.25,.46,.45,.94) both}
  .intro .hero h1{animation:in-rise .8s .4s cubic-bezier(.25,.46,.45,.94) both}
  .intro .ripple{animation:in-rise .85s cubic-bezier(.25,.46,.45,.94) both;animation-delay:calc(.62s + var(--i,0) * .1s)}
  .intro .top{animation:in-fade .7s .7s both}
}
.body h3{margin:26px 0 10px;font-size:18px;font-weight:700}
.body figure.img{margin:18px 0}
.body figure.img img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:var(--soft)}
.body figcaption{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted);font-size:14px}
/* hero groups */
.hcopy{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.hcopy .lead{margin:4px 0 0!important}
.hfind{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.hfind .chips{margin-top:0}
.hcue{display:none}
/* mobile: the hero fills the first screen, logo larger, search anchored low */
@media (max-width:899px){
  .hero{--bh:min(36vh,70vw);--bh:min(36svh,70vw);display:flex;flex-direction:column;min-height:calc(100vh - var(--head) - env(safe-area-inset-top,0px));min-height:calc(100svh - var(--head) - env(safe-area-inset-top,0px))}
  .hero .wrap{flex:1;justify-content:flex-start;gap:0;padding-top:calc(var(--bh) - 6px);padding-bottom:20px}
  .hero .ban{-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
  .hcopy{gap:10px}
  .eyebrow{font-size:15px}
  .hero h1{font-size:clamp(24px,6.8vw,29px);line-height:1.3;text-wrap:balance}
  .hero p.lead{font-size:14.5px;line-height:1.65}
  .hfind{margin-top:auto;padding-top:24px;gap:10px}
  .hcue{display:flex;align-items:center;justify-content:center;width:44px;height:40px;margin:4px auto 0;color:#8C8C8C}
  .hcue svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
}
@media (max-width:899px) and (prefers-reduced-motion: no-preference){
  @keyframes cue{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
  .hcue svg{animation:cue 2.4s ease-in-out 2.2s infinite}
}
@media (max-width:899px) and (max-height:679px){.hcue{display:none}.hero .wrap{padding-bottom:24px}}
@media (max-width:899px) and (max-height:560px){.hero{min-height:0}.hfind{margin-top:0}}
/* 관리자 화면에서 엔터로 줄을 바꾼 곳은 그대로 줄바꿈해서 보여줘요. */
.hero p.lead,.ucard p,.vcard p,.steps span.d,.ccard p,.cat-head p,.lead2{white-space:pre-line}
</style>
</head>
<body>
<div id="root"><div class="loading">가이드를 불러오고 있어요…</div></div>
<script>
(function () {
'use strict';
/* 내용은 /guide.json 에서 읽어요. guide.json 은 배포할 때 build.js 가 content/ 폴더로 만들어요. */
var LOGO = '/assets/logo.png';
var BANNER = '/assets/banner.jpg';
var root = document.getElementById('root');
var DATA = null, view = null, introDone = false, adminMode = false, IS_PREVIEW = false, IMGMAP = {};
/* 관리자 화면의 미리보기 칸에서 열린 경우: 관리자가 보내 주는 수정 중인 내용을 보여줘요. */
var PREVIEW = /[?&]preview=1(&|$)/.test(location.search) && window.parent !== window;
if (PREVIEW) IS_PREVIEW = true;
var ICONS = {
  user: '<circle cx="10" cy="8" r="4"/><path d="M3 21a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/>',
  coin: '<circle cx="12" cy="12" r="9"/><path d="M9 8.5h4.5a2 2 0 0 1 0 4H9v4M9 12.5h4"/>',
  bag: '<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  camera: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  refresh: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9"/><path d="M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15"/><path d="M4 20v-5h5"/>',
  help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5v.01"/>',
  chat: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  check: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 12l2 2 4-4"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  page: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/><path d="M7 14h6"/>',
  gift: '<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12"/><path d="M12 9c-2-4-6-4-6-1.5S9 9 12 9zm0 0c2-4 6-4 6-1.5S15 9 12 9z"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/>'
};
var ICON_NAMES = [['user', '사람'], ['coin', '적립금'], ['bag', '쇼핑백'], ['camera', '카메라'], ['link', '링크'], ['refresh', '교환'], ['help', '물음표'], ['chat', '말풍선'], ['check', '체크'], ['trend', '상승'], ['page', '페이지'], ['gift', '선물'], ['star', '별']];

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function safeUrl(u) { u = String(u || '').trim(); return /^(https?:\/\/|#)/i.test(u) ? u : ''; }
function inline(s) {

}
var IMG_LINE = /^\s*!\[([^\]]*)\]\(((?:\/images\/|https:\/\/)[^)\s]+)\)\s*$/;

function md(text) {
  var src = String(text || '').replace(/\r/g, '').replace(/\\([\\`*_{}\[\]()#+\-.!|>~])/g, '$1');
  var lines = src.split('\n'), out = [], i = 0;
  function take(re) { var b = []; while (i < lines.length && re.test(lines[i])) { b.push(lines[i]); i++; } return b; }
  while (i < lines.length) {
    var l = lines[i];
    if (!l.trim()) { i++; continue; }
    var im = l.match(IMG_LINE);
    if (im) { out.push('<figure class="img"><img src="' + esc(IMGMAP[im[2]] || im[2]) + '" alt="' + esc(im[1]) + '" loading="lazy">' + (im[1] ? '<figcaption>' + esc(im[1]) + '</figcaption>' : '') + '</figure>'); i++; continue; }
    if (HD.test(l)) { out.push('<h3>' + inline(l.replace(HD, '')) + '</h3>'); i++; continue; }
    if (UL.test(l)) { out.push('<ul>' + take(UL).map(function (x) { return '<li>' + inline(x.replace(UL, '')) + '</li>'; }).join('') + '</ul>'); continue; }
    if (OL.test(l)) { out.push('<ol>' + take(OL).map(function (x) { return '<li>' + inline(x.replace(OL, '')) + '</li>'; }).join('') + '</ol>'); continue; }
    if (QT.test(l)) { out.push('<p class="note">' + take(QT).map(function (x) { return inline(x.replace(QT, '')); }).filter(Boolean).join('<br>') + '</p>'); continue; }
    if (TB.test(l)) {
      var rows = take(TB).filter(function (r) { return !/^[\s|:\-]+$/.test(r); }).map(function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); });
      if (rows.length) out.push('<div class="tbl"><table><thead><tr>' + rows[0].map(function (c) { return '<th scope="col">' + inline(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.slice(1).map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
      continue;
    }

    while (i < lines.length && lines[i].trim() && !IMG_LINE.test(lines[i]) && !HD.test(lines[i]) && !UL.test(lines[i]) && !OL.test(lines[i]) && !QT.test(lines[i]) && !TB.test(lines[i])) { para.push(lines[i].replace(/\s{2,}$|\\$/, '')); i++; }

}
function plain(text) { return String(text || '').replace(/!\[[^\]]*\]\([^)]+\)/g, ' ').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').replace(/[*|>#\\]/g, ' '); }
function getPath(o, p) { return p.split('.').reduce(function (x, k) { return x == null ? x : x[k]; }, o); }
function setPath(o, p, v) { var ks = p.split('.'), last = ks.pop(); getPath(o, ks.join('.'))[last] = v; }

function today() { var d = new Date(); return d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }

/* ---------- routing: #<article id>, #c-<category id>, empty = home ---------- */
function route() {
  var h = decodeURIComponent((location.hash || '').slice(1));
  if (!h) h = view._preview || '';

  var cats = view.categories || [];
  if (h.indexOf('c-') === 0) { var c = cats.filter(function (x) { return x.id === h.slice(2); })[0]; if (c) return { v: 'cat', c: c }; }
  var hit = allArticles(view).filter(function (x) { return x.a.id === h; })[0];
  if (hit) return { v: 'art', a: hit.a, c: hit.c };
  var sec = document.getElementById(h);
  return { v: 'home', anchor: sec ? h : null };
}

/* ---------- render ---------- */
var lastRoute = null;
function render(keepScroll) {
  var r = route();
  var key = r.v + (r.c ? r.c.id : '') + (r.a ? r.a.id : '');
  var y = window.scrollY;
  root.innerHTML = r.v === 'art' ? artHTML(r.a, r.c) : r.v === 'cat' ? catHTML(r.c) : homeHTML();
  if (!introDone) { introDone = true; if (r.v === 'home' && !IS_PREVIEW) { root.classList.add('intro'); setTimeout(function () { root.classList.remove('intro'); }, 3000); } }
  else root.classList.remove('intro');
  bind();
  if (keepScroll || key === lastRoute) window.scrollTo(0, y);
  else if (r.anchor) { var t = document.getElementById(r.anchor); if (t) t.scrollIntoView(); }
  else window.scrollTo(0, 0);
  lastRoute = key;

function bind() {

      var t = q.value.trim().toLowerCase();
      if (!t) { res.hidden = true; res.innerHTML = ''; return; }
      var hits = allArticles(view).filter(function (x) { return (x.a.title + ' ' + plain(x.a.body) + ' ' + x.c.name).toLowerCase().indexOf(t) > -1; }).slice(0, 8);
      var kakao = safeUrl((view.links || {}).kakao);
      res.innerHTML = hits.length ? hits.map(function (x) { return '<li><a href="#' + esc(x.a.id) + '"><small>' + esc(x.c.name) + '</small>' + esc(x.a.title) + '</a></li>'; }).join('')
        : '<li class="none">찾는 내용이 없어요. 다른 단어로 검색하거나 ' + (kakao ? '<a href="' + esc(kakao) + '">카카오채널</a>로 물어봐 주세요.' : '담당자에게 물어봐 주세요.') + '</li>';
      res.hidden = false;
    };
    q.addEventListener('input', run);
    q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); run(); var f = res.querySelector('a'); if (f) f.focus(); } });
    document.getElementById('qgo').addEventListener('click', function () { run(); q.focus(); });
    root.querySelectorAll('.chips button').forEach(function (b) { b.addEventListener('click', function () { q.value = b.dataset.q; run(); }); });
  }
  var cue = root.querySelector('.hcue');
  if (cue) cue.addEventListener('click', function (e) { e.preventDefault(); var s = document.getElementById('start'); if (s) s.scrollIntoView({ behavior: 'smooth' }); });
  var tg = root.querySelector('.side-toggle');

    var nav = document.getElementById('sidenav'), open = tg.getAttribute('aria-expanded') === 'true';

    if (open) nav.setAttribute('data-closed', ''); else nav.removeAttribute('data-closed');
  });

  if (fb) fb.addEventListener('click', function (e) {
    var b = e.target.closest('[data-fb]'); if (!b) return;
    if (b.dataset.fb === 'yes') fb.innerHTML = '<span>의견 감사해요!</span>';
    else fb.innerHTML = document.getElementById('fb-no').innerHTML;
  });
}
window.addEventListener('hashchange', function () { if (view) render(); });
if (PREVIEW) window.addEventListener('message', function (e) {
  if (e.origin !== location.origin || e.source !== window.parent || !e.data || e.data.type !== 'haulo-preview') return;
  IMGMAP = e.data.imgs || {}; view = e.data.data; render(e.data.keep);
});
function ready() { if (PREVIEW) window.parent.postMessage({ type: 'haulo-preview-ready' }, location.origin); }
fetch('/guide.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (d) { DATA = view = d; render(); ready(); })
  .catch(function () { root.innerHTML = '<div class="loading">가이드를 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>'; ready(); });
})();
